name: Windows

# The repository's Windows checks beside ci.yml, on pushes to `main`, on pull requests and on
# demand: the protocol, daemon and messenger on Windows, the native helpers' crates, and the
# daemon's remote setup channel over stdin and stdout. The native app itself is built and checked
# on Windows by nsh-desktop.yml, and packaged by release.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # windows-latest runners default `run:` steps to PowerShell; this repo's scripts (and the
    # pipe-separated multi-line steps below) assume the bash the runner image ships (Git Bash).
    shell: bash

jobs:
  unit:
    name: Windows unit tests
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/conpty-helper -> target
            apps/rtc-helper -> target

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # Every check after the install runs even when an earlier one failed, so one run shows all
      # of what is still broken on Windows; the job still goes red if any of them failed.
      - name: Protocol tests
        if: success() || failure()
        run: pnpm --filter @real-bot/protocol test

      - name: Typecheck protocol
        if: success() || failure()
        run: pnpm --filter @real-bot/protocol typecheck

      - name: Typecheck daemon
        if: success() || failure()
        run: pnpm --filter @real-bot/daemon typecheck

      - name: Typecheck desktop
        if: success() || failure()
        run: pnpm --filter @real-bot/desktop-nsh typecheck

      - name: Desktop script and logic tests
        if: success() || failure()
        run: pnpm --filter @real-bot/desktop-nsh test

      - name: ConPTY helper crate tests
        if: success() || failure()
        run: cargo test --manifest-path apps/conpty-helper/Cargo.toml

      - name: Remote screen helper tests
        if: success() || failure()
        run: cargo test --locked --manifest-path apps/rtc-helper/Cargo.toml

      # The daemon's terminal tests drive the real helper and skip when it is not built.
      - name: Build ConPTY helper for the daemon's terminal tests
        if: success() || failure()
        run: cargo build --manifest-path apps/conpty-helper/Cargo.toml

      # The remote setup channel over the daemon's stdin and stdout (`remote/window-setup.test.ts`):
      # the Windows shell pairs phones over it, so it gates, unlike the rest of the suite below.
      - name: Daemon remote setup channel (stdin/stdout)
        if: success() || failure()
        working-directory: apps/daemon
        run: bun test src/remote/window-setup.test.ts

      # Report-only: most of the daemon suite still assumes POSIX (paths, signals, process
      # groups). We want to see how much of it already passes on Windows, not block the job on it.
      # Its own limit too: on a slow runner it ran past 31 minutes (19.5 the day before), and the
      # job's 40 then cancelled the whole job, gating steps and all (2026-10-15).
      - name: Daemon tests (informational — many are still POSIX-only)
        if: success() || failure()
        continue-on-error: true
        timeout-minutes: 28
        run: pnpm --filter @real-bot/daemon test
