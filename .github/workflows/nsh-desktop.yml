name: NSH desktop

# The NSH rewrite's desktop shell on Windows and Linux (ADR 0107, Phase 1a): NSH builds each
# desktop on its own OS only, so these runners are where the two are built and checked. Branch
# nsh-spike only, until the rewrite lands.

on:
  push:
    branches: [nsh-spike]
    paths:
      - apps/desktop-nsh/**
      - apps/daemon/**
      - apps/messenger/src/lib/**
      - packages/protocol/**
      - .github/workflows/nsh-desktop.yml
  workflow_dispatch:

concurrency:
  group: nsh-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The `nsh` CLI is built from the same upstream commit the Rust crates are locked to
  # (`apps/desktop-nsh/Cargo.lock`): the bundle format and the engine must match.
  NSH_REPO: https://github.com/longbridge/nsh

jobs:
  desktop:
    name: NSH desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A cache miss builds the nsh CLI first (~30 minutes).
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-nsh -> target

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev clang pkg-config xvfb dbus-x11

      - name: NSH commit (from Cargo.lock)
        id: nsh
        run: |
          rev=$(grep -m1 -oE 'longbridge/nsh\?[^#"]*#[0-9a-f]{40}' apps/desktop-nsh/Cargo.lock | cut -d'#' -f2)
          if [ -z "$rev" ]; then echo "::error::no longbridge/nsh git source in apps/desktop-nsh/Cargo.lock"; exit 1; fi
          # On Windows `pwd -W` gives the home as C:/Users/..., which the cache action and PATH take.
          home=$(cd ~ && (pwd -W 2>/dev/null || pwd))
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "root=$home/.nsh-cli" >> "$GITHUB_OUTPUT"
          echo "$home/.nsh-cli/bin" >> "$GITHUB_PATH"

      # Its own install root, apart from ~/.cargo/bin (which rust-cache keeps by the lockfile), keyed
      # by OS and commit: a cache hit skips the ~30-minute release build.
      - name: Cache nsh
        id: nsh-cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.nsh.outputs.root }}
          key: nsh-cli-${{ runner.os }}-${{ steps.nsh.outputs.rev }}

      - name: Build nsh
        if: steps.nsh-cache.outputs.cache-hit != 'true'
        run: cargo install --git "$NSH_REPO" --rev ${{ steps.nsh.outputs.rev }} nsh-cli --locked --root "${{ steps.nsh.outputs.root }}"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: nsh version
        run: nsh --version

      - name: Dev instance scripts, the messenger mirror, the scripts' types
        run: |
          pnpm --filter @real-bot/desktop-nsh test
          pnpm --filter @real-bot/desktop-nsh typecheck

      - name: Rust tests (shell, components, the app's crate)
        working-directory: apps/desktop-nsh
        run: cargo test --workspace

      - name: Type-check and headless UI tests
        working-directory: apps/desktop-nsh/app
        run: |
          nsh check App.tsx
          nsh test

      - name: Screen tests against an isolated runtime
        run: bun apps/desktop-nsh/scripts/ui-tests.ts

      - name: Build the shell and the bundle
        working-directory: apps/desktop-nsh
        run: |
          cargo build -p deskfolk-nsh
          (cd app && nsh build App.tsx --out ../build/app)

      - name: Windows binary imports (no web view)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "Hostx64\\x64" } | Select-Object -First 1
          & $dumpbin.FullName /dependents apps\desktop-nsh\target\debug\deskfolk-nsh.exe

      - name: Linux binary libraries (no web view)
        if: runner.os == 'Linux'
        run: ldd apps/desktop-nsh/target/debug/deskfolk-nsh | grep -iE "webkit|gtk|javascriptcore" || true

      - name: Smoke (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1280x900x24" bun apps/desktop-nsh/scripts/ci-smoke.ts apps/desktop-nsh/target/debug/deskfolk-nsh apps/desktop-nsh/build/app/bundle.js --timeout 180

      - name: Smoke (Windows)
        if: runner.os == 'Windows'
        run: bun apps/desktop-nsh/scripts/ci-smoke.ts apps/desktop-nsh/target/debug/deskfolk-nsh.exe apps/desktop-nsh/build/app/bundle.js --timeout 180
