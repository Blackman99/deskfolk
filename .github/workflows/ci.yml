name: CI

on:
  push:
    branches: [main, linux-compat]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/remote/test/snow -> target
            apps/conpty-helper -> target

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # The daemon's pty and terminal tests drive the real helper and skip when it is not built;
      # on Linux that is apps/conpty-helper's forkpty backend.
      - name: Build the pty helper
        run: cargo build --manifest-path apps/conpty-helper/Cargo.toml

      # Pictures sent to a model shrink through ImageMagick on Linux; its tests skip without it,
      # and the runner image does not ship it.
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false

      - name: Test real relay HTTP, TLS and WSS edge
        run: |
          go install github.com/caddyserver/caddy/v2/cmd/caddy@v2.10.2
          CADDY_BIN="$(go env GOPATH)/bin/caddy" pnpm --filter @real-bot/relay test:edge

      - name: Build shared remote package and browser fixture
        run: pnpm --filter @real-bot/remote build && pnpm --filter @real-bot/remote build:browser

      - name: Build messenger
        run: pnpm --filter @real-bot/messenger build

      - name: Build landing
        run: pnpm --filter @real-bot/landing build

  desktop:
    name: Desktop unit tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Desktop script tests and typecheck
        run: pnpm --filter @real-bot/desktop test && pnpm --filter @real-bot/desktop typecheck

      - name: Native credential fixtures (no Keychain or prompts)
        run: swift run --package-path apps/runtime-helper RemoteCoreTests

      - name: Cargo test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      # Linux ships this crate's forkpty backend; its tests drive real shells on macOS too.
      - name: Pty helper crate tests
        run: cargo test --manifest-path apps/conpty-helper/Cargo.toml

      - name: Remote screen helper tests
        run: cargo test --locked --manifest-path apps/rtc-helper/Cargo.toml
