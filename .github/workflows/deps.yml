name: Dependencies

# npm dependencies, weekly: taze (`taze.config.js`) bumps every package.json within the range it
# already allows (majors and exact pins stay), pnpm refreshes the lockfile, and a change is
# committed straight to main as `chore: update deps`. A push made with GITHUB_TOKEN starts no
# workflows, so the job then starts CI and Windows on that commit, and NSH desktop when the native
# app's side moved. GitHub Actions and the native app's crates stay with Dependabot
# (`.github/dependabot.yml`), one grouped PR each.
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

concurrency:
  group: deps
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  update:
    name: Update npm dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Bump within the allowed ranges
        run: pnpm dlx taze@19 -w

      - name: Refresh the lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit to main and start the checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Every dependency is already the newest its range allows."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update deps"
          git push origin HEAD:main
          gh workflow run ci.yml --ref main
          gh workflow run windows.yml --ref main
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(apps/desktop-nsh|apps/daemon|packages/protocol)/'; then
            gh workflow run nsh-desktop.yml --ref main
          fi
