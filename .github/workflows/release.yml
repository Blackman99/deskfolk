name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify before packaging
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Native credential fixtures (no Keychain or prompts)
        run: swift run --package-path apps/runtime-helper RemoteCoreTests

      - name: Cargo test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Remote screen helper tests
        run: cargo test --locked --manifest-path apps/rtc-helper/Cargo.toml

      - name: Build messenger
        run: pnpm --filter @real-bot/messenger build

  # The Windows half of the verification: windows.yml's unit checks, without its own installer.
  verify-windows:
    name: Verify on Windows
    uses: ./.github/workflows/windows.yml
    with:
      skip-bundle: true

  publish:
    name: Package macOS snapshot
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: aarch64-apple-darwin
          - triple: x86_64-apple-darwin
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # Developer ID signing and notarization turn on once the repository has these secrets; without
      # them the build stays ad-hoc signed and nothing below is exported (an empty
      # APPLE_SIGNING_IDENTITY or APPLE_ID would make Tauri sign with "" or notarize an ad-hoc app).
      # The certificate goes into a throwaway keychain before the build because build-native signs the
      # bundled daemon, pty and helper before Tauri would import it. See docs/notarization.md.
      - name: Developer ID signing (when configured)
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "No APPLE_SIGNING_IDENTITY secret: this build stays ad-hoc signed."
            exit 0
          fi
          keychain="$RUNNER_TEMP/deskfolk-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$NOTARY_APPLE_ID" ] && [ -n "$NOTARY_PASSWORD" ] && [ -n "$NOTARY_TEAM_ID" ]; then
            {
              echo "APPLE_ID=$NOTARY_APPLE_ID"
              echo "APPLE_PASSWORD=$NOTARY_PASSWORD"
              echo "APPLE_TEAM_ID=$NOTARY_TEAM_ID"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::Signing with Developer ID but not notarizing: APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID are not all set."
          fi

      # The body is this version's CHANGELOG section: the app renders it in the About card when it
      # finds an update, so it has to say what changed rather than point at the file.
      # MACOS_NOTARIZED picks the signing note under it; the Windows job computes the same value.
      - name: Release notes from CHANGELOG
        id: notes
        env:
          MACOS_NOTARIZED: ${{ secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            bun apps/desktop/scripts/release-notes.ts
            echo
            echo RELEASE_NOTES_EOF
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: Deskfolk v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: true
          generateReleaseNotes: false
          uploadUpdaterJson: false
          args: --target ${{ matrix.triple }}

  # Same release, same tag: tauri-action finds the one the macOS jobs create (or creates it first)
  # and adds Deskfolk_<version>_x64-setup.exe, the asset the Windows update check looks for. A
  # release without it is no update for Windows at all, so a failed Windows job only holds back
  # Windows users; it never points them at a page with nothing to install.
  publish-windows:
    name: Package Windows installer
    needs: [verify, verify-windows]
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/conpty-helper -> target
            apps/desktop/src-tauri -> target
            apps/rtc-helper -> target

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # Code signing turns on once WINDOWS_SIGN_COMMAND is set: a command in the form of Tauri's
      # `bundle.windows.signCommand` string, `%1` standing for the file. Tauri signs the app and
      # the installer with it; build-native signs the daemon, the pty helper and the WebRTC helper
      # with the same value. Without it the installer stays unsigned, and SmartScreen warns on first run.
      # trusted-signing-cli (Azure Trusted Signing) is installed when the command names it, and
      # reads its credentials from the AZURE_* secrets passed to the build below.
      - name: Windows signing (when configured)
        env:
          SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
        run: |
          if [ -z "$SIGN_COMMAND" ]; then
            echo "No WINDOWS_SIGN_COMMAND secret: this installer stays unsigned."
            exit 0
          fi
          case "$SIGN_COMMAND" in
            trusted-signing-cli\ *) cargo install trusted-signing-cli --locked ;;
          esac
          # Forward slashes (cygpath -m): tauri-action splits `args` itself and backslashes would not survive.
          export CONFIG="$(cygpath -m "$RUNNER_TEMP/tauri-windows-signing.json")"
          bun -e 'await Bun.write(process.env.CONFIG, JSON.stringify({ bundle: { windows: { signCommand: process.env.SIGN_COMMAND } } }))'
          {
            echo "REAL_BOT_WINDOWS_SIGN_COMMAND=$SIGN_COMMAND"
            echo "TAURI_SIGNING_ARGS=--config $CONFIG"
          } >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG
        id: notes
        env:
          MACOS_NOTARIZED: ${{ secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            bun apps/desktop/scripts/release-notes.ts
            echo
            echo RELEASE_NOTES_EOF
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: Deskfolk v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: true
          generateReleaseNotes: false
          uploadUpdaterJson: false
          args: --bundles nsis ${{ env.TAURI_SIGNING_ARGS }}
