name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify before packaging
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      # `externalBin` is checked when the crate compiles, so the daemon binary has to exist first.
      - name: Build daemon sidecar
        run: pnpm --filter @real-bot/daemon build:sidecar

      - name: Cargo test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build messenger
        run: pnpm --filter @real-bot/messenger build

  publish:
    name: Package macOS snapshot
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: aarch64-apple-darwin
          - triple: x86_64-apple-darwin
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # The app carries its own runtime: this is the daemon compiled for the target being packaged,
      # bundled as `externalBin`. Passed explicitly rather than left to the build hook, so the
      # cross-built job cannot quietly package the runner's own architecture.
      - name: Build daemon sidecar
        run: pnpm --filter @real-bot/daemon build:sidecar ${{ matrix.triple }}

      # The body is this version's CHANGELOG section: the app renders it in the About card when it
      # finds an update, so it has to say what changed rather than point at the file.
      - name: Release notes from CHANGELOG
        id: notes
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            bun apps/desktop/scripts/release-notes.ts
            echo
            echo RELEASE_NOTES_EOF
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: Real Bot v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: true
          generateReleaseNotes: false
          uploadUpdaterJson: false
          args: --target ${{ matrix.triple }}
