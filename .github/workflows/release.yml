name: Release

# A `v*` tag publishes Deskfolk. Since 0.5.0 the Mac app is the native one (`apps/desktop-nsh`,
# ADR 0107): `apps/desktop-nsh/scripts/package.ts --release` builds `Deskfolk_<version>_aarch64.dmg`
# and `Deskfolk_<version>_x64.dmg`, the names the update check of every Deskfolk since 0.1 looks for,
# with the bundle id and version its installer verifies, so a Mac on the Tauri app updates in place.
# The release is created only once every check has passed and the two images and the installer are
# built (the images notarized) and launched once on a runner with their own daemon.
#
# Windows gets the native app too: `Deskfolk_<version>_x64-setup.exe` (`package.ts --release` on
# Windows, `scripts/installer.nsi`), the name the Windows update check looks for, installing over
# the Tauri app's folder and uninstall entry.
#
# Linux (x86_64) gets it as well: `Deskfolk_<version>_amd64.deb` and `Deskfolk_<version>_amd64.AppImage`
# (`package.ts --release` on Linux), the names the Linux update check looks for. The deb upgrades the
# Tauri preview of 0.4.0 in place (same package name, files and program name); both are launched
# once under a virtual display (`--smoke`).
#
# Run by hand (Actions → Release → Run workflow), it does everything but publish and keeps the
# images as the run's artifacts.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# The `nsh` CLI comes from the NSH commit `apps/desktop-nsh/Cargo.toml` pins its crates to, built by
# `scripts/nsh-cli.ts` (bundle format and engine must match), cached by that commit as in
# nsh-desktop.yml.
env:
  DESKFOLK_NSH_CACHE: ${{ github.workspace }}/.nsh-cli-cache

jobs:
  verify:
    name: Verify before packaging
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/rtc-helper -> target

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Native credential fixtures (no Keychain or prompts)
        run: swift run --package-path apps/runtime-helper RemoteCoreTests

      - name: Remote screen helper tests
        run: cargo test --locked --manifest-path apps/rtc-helper/Cargo.toml

  # The native app's own checks on macOS (nsh-desktop.yml runs them on Windows and Linux).
  verify-nsh:
    name: Verify the native app on macOS
    runs-on: macos-latest
    # A cache miss builds the nsh CLI first (~30 minutes).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-nsh -> target

      - name: The pinned NSH commit
        id: nsh
        run: echo "rev=$(grep -m1 '^nsh-core' apps/desktop-nsh/Cargo.toml | sed -E 's/.*rev = "([0-9a-f]+)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Restore the nsh CLI of that commit
        id: nsh-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DESKFOLK_NSH_CACHE }}
          key: nsh-cli-${{ runner.os }}-${{ steps.nsh.outputs.rev }}

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build nsh at the pinned commit
        run: |
          set -o pipefail
          nsh="$(bun apps/desktop-nsh/scripts/nsh-cli.ts | tail -1)"
          dirname "$nsh" >> "$GITHUB_PATH"

      - name: Save the nsh CLI of that commit
        if: steps.nsh-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DESKFOLK_NSH_CACHE }}
          key: nsh-cli-${{ runner.os }}-${{ steps.nsh.outputs.rev }}

      - name: Rust tests (shell, components, the app's crate)
        working-directory: apps/desktop-nsh
        run: cargo test --workspace

      - name: Type-check and headless UI tests
        working-directory: apps/desktop-nsh/app
        run: |
          nsh check App.tsx
          nsh test

      # The screen tests (`scripts/ui-tests.ts`) are not run here: nsh-desktop.yml runs them on Linux
      # on every push to main, and on this runner two of them miss on its speed alone while the job
      # would run past its time limit on a tag, which builds the nsh CLI afresh.

  package:
    name: Package the Mac app (${{ matrix.arch }})
    needs: [verify, verify-nsh]
    strategy:
      # A release carries both images or none: Intel Macs would otherwise see no update at all.
      fail-fast: true
      matrix:
        include:
          # Both are launched once on the runner (--smoke); it is Apple silicon, so the Intel one runs
          # under Rosetta.
          - triple: aarch64-apple-darwin
            arch: aarch64
            smoke: '--smoke'
          - triple: x86_64-apple-darwin
            arch: x64
            smoke: '--smoke'
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-nsh -> target
          key: ${{ matrix.triple }}

      - name: The pinned NSH commit
        id: nsh
        run: echo "rev=$(grep -m1 '^nsh-core' apps/desktop-nsh/Cargo.toml | sed -E 's/.*rev = "([0-9a-f]+)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Restore the nsh CLI of that commit
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DESKFOLK_NSH_CACHE }}
          key: nsh-cli-${{ runner.os }}-${{ steps.nsh.outputs.rev }}

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # Developer ID signing and notarization turn on once the repository has these secrets; without
      # them the build stays ad-hoc signed and nothing below is exported (an empty
      # APPLE_SIGNING_IDENTITY or APPLE_ID would sign with "" or notarize an ad-hoc app). The
      # certificate goes into a throwaway keychain: build-native signs the daemon and its helpers,
      # then package.ts the app and the dmg, with no prompt. See docs/notarization.md.
      - name: Developer ID signing (when configured)
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "No APPLE_SIGNING_IDENTITY secret: this build stays ad-hoc signed."
            exit 0
          fi
          keychain="$RUNNER_TEMP/deskfolk-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$NOTARY_APPLE_ID" ] && [ -n "$NOTARY_PASSWORD" ] && [ -n "$NOTARY_TEAM_ID" ]; then
            # Asked before the half-hour build: Apple refuses every submission (403) while the account
            # has an agreement left to accept, and that should fail here, in seconds.
            if ! xcrun notarytool history --apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_PASSWORD" --team-id "$NOTARY_TEAM_ID" > "$RUNNER_TEMP/notary-history.txt" 2>&1; then
              cat "$RUNNER_TEMP/notary-history.txt"
              echo "::error::Apple's notary service refuses this account (an agreement to accept at developer.apple.com?)"
              exit 1
            fi
            {
              echo "APPLE_ID=$NOTARY_APPLE_ID"
              echo "APPLE_PASSWORD=$NOTARY_PASSWORD"
              echo "APPLE_TEAM_ID=$NOTARY_TEAM_ID"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::Signing with Developer ID but not notarizing: APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID are not all set."
          fi

      - name: Package, sign, notarize
        run: |
          sign=adhoc
          notarize=()
          [ -n "${APPLE_SIGNING_IDENTITY:-}" ] && sign=developer-id
          [ -n "${APPLE_ID:-}" ] && notarize=(--notarize env)
          bun apps/desktop-nsh/scripts/package.ts --release --target ${{ matrix.triple }} --sign "$sign" "${notarize[@]}" ${{ matrix.smoke }} --out "$RUNNER_TEMP/deskfolk"

      - uses: actions/upload-artifact@v4
        with:
          name: deskfolk-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/deskfolk/*.dmg
          if-no-files-found: error

  # The Windows installer, built and checked on Windows: NSH builds each desktop on its own OS.
  # On a `v*` tag with SignPath Foundation secrets configured (`SIGNPATH_API_TOKEN` and
  # `SIGNPATH_ORGANIZATION_ID`), inner binaries and the NSIS installer are signed via SignPath
  # before smoke-testing (see docs/code-signing-policy.md). Otherwise the installer stays unsigned
  # and SmartScreen warns about an unknown publisher.
  package-windows:
    name: Package the Windows installer
    needs: [verify]
    outputs:
      signed: ${{ steps.signpath.outputs.enabled }}
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop-nsh -> target
            apps/conpty-helper -> target
            apps/rtc-helper -> target

      - name: The pinned NSH commit
        id: nsh
        run: echo "rev=$(grep -m1 '^nsh-core' apps/desktop-nsh/Cargo.toml | sed -E 's/.*rev = "([0-9a-f]+)".*/\1/')" >> "$GITHUB_OUTPUT"

      # The key nsh-desktop.yml saves under on main, where a tag can read it.
      - name: Restore the nsh CLI of that commit
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DESKFOLK_NSH_CACHE }}
          key: nsh-cli-${{ runner.os }}-${{ steps.nsh.outputs.rev }}

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: NSIS
        run: |
          if ! command -v makensis >/dev/null && [ ! -x "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            choco install nsis -y --no-progress
          fi

      # The installers the smoke installs first and goes over: the latest release's, and 0.4.0's,
      # the last Tauri app, which installs that never took 0.5.0 still have.
      - name: Earlier installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/previous/latest" "$RUNNER_TEMP/previous/tauri"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*_x64-setup.exe' --dir "$RUNNER_TEMP/previous/latest" || true
          gh release download v0.4.0 --repo "$GITHUB_REPOSITORY" --pattern '*_x64-setup.exe' --dir "$RUNNER_TEMP/previous/tauri" || true
          ls -la "$RUNNER_TEMP"/previous/*

      - name: SignPath signing (when configured)
        id: signpath
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]] && [ -n "$SIGNPATH_API_TOKEN" ] && [ -n "$SIGNPATH_ORGANIZATION_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "SignPath Windows code signing is enabled for ${GITHUB_REF_NAME}."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SignPath Windows code signing is not active (requires a v* tag and SIGNPATH_API_TOKEN + SIGNPATH_ORGANIZATION_ID secrets)."
          fi

      # Installed silently over each of them in turn (each in a folder of its own choosing), launched
      # at login's way with its own daemon, launched again, closed, uninstalled (`--smoke`).
      - name: Package and check the installer (unsigned)
        if: steps.signpath.outputs.enabled != 'true'
        run: |
          upgrade=()
          for previous in "$RUNNER_TEMP"/previous/*/*_x64-setup.exe; do
            [ -f "$previous" ] && upgrade+=(--upgrade-from "$previous")
          done
          bun apps/desktop-nsh/scripts/package.ts --release --smoke "${upgrade[@]}" --out "$RUNNER_TEMP/deskfolk"

      - name: Stage Windows binaries for SignPath
        if: steps.signpath.outputs.enabled == 'true'
        run: |
          bun apps/desktop-nsh/scripts/package.ts --release --stage-only --out "$RUNNER_TEMP/deskfolk"
          rm -rf "$RUNNER_TEMP/signpath-binaries-in"
          mkdir -p "$RUNNER_TEMP/signpath-binaries-in/native"
          cp "$RUNNER_TEMP/deskfolk/stage/Deskfolk.exe" "$RUNNER_TEMP/signpath-binaries-in/Deskfolk.exe"
          for name in real-bot-daemon.exe real-bot-pty.exe real-bot-rtc.exe; do
            cp "$RUNNER_TEMP/deskfolk/stage/native/$name" "$RUNNER_TEMP/signpath-binaries-in/native/$name"
          done

      # Deliberately not prefixed with `deskfolk-` so publish's `download-artifact` (`deskfolk-*`)
      # never downloads intermediate unsigned artifacts.
      - name: Upload unsigned Windows binaries for SignPath
        id: upload-unsigned-binaries
        if: steps.signpath.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signpath-unsigned-windows-binaries
          path: ${{ runner.temp }}/signpath-binaries-in
          retention-days: 1
          if-no-files-found: error

      - name: Sign Windows binaries via SignPath
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'deskfolk' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: windows-binaries
          github-artifact-id: ${{ steps.upload-unsigned-binaries.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/signpath-binaries-out

      - name: Apply and verify signed Windows binaries
        if: steps.signpath.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = Join-Path $env:RUNNER_TEMP 'signpath-binaries-out'
          $unpacked = Join-Path $env:RUNNER_TEMP 'signpath-binaries-unpacked'
          if (Test-Path $unpacked) { Remove-Item -Recurse -Force $unpacked }
          New-Item -ItemType Directory -Force -Path $unpacked | Out-Null

          $zips = Get-ChildItem -Path $outDir -Filter '*.zip' -File
          if ($zips.Count -gt 0) {
            Expand-Archive -Path $zips[0].FullName -DestinationPath $unpacked -Force
          } else {
            Copy-Item -Path (Join-Path $outDir '*') -Destination $unpacked -Recurse -Force
          }

          $stage = Join-Path $env:RUNNER_TEMP 'deskfolk/stage'
          $binaries = @(
            'Deskfolk.exe',
            'native/real-bot-daemon.exe',
            'native/real-bot-pty.exe',
            'native/real-bot-rtc.exe'
          )
          foreach ($rel in $binaries) {
            $src = Join-Path $unpacked $rel
            $dst = Join-Path $stage $rel
            if (-not (Test-Path $src)) { throw "Signed binary missing: $src" }
            Copy-Item -Path $src -Destination $dst -Force
            $sig = Get-AuthenticodeSignature -LiteralPath $dst
            if ($sig.Status -ne 'Valid') {
              throw "Invalid Authenticode signature on ${rel}: $($sig.Status) ($($sig.StatusMessage))"
            }
            Write-Host "Verified signature on ${rel}: $($sig.SignerCertificate.Subject)"
          }

      - name: Build Windows installer from signed stage
        if: steps.signpath.outputs.enabled == 'true'
        run: |
          bun apps/desktop-nsh/scripts/package.ts --release --from-stage "$RUNNER_TEMP/deskfolk/stage" --out "$RUNNER_TEMP/deskfolk"

      - name: Upload unsigned Windows installer for SignPath
        id: upload-unsigned-installer
        if: steps.signpath.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signpath-unsigned-windows-installer
          path: ${{ runner.temp }}/deskfolk/*-setup.exe
          retention-days: 1
          if-no-files-found: error

      - name: Sign Windows installer via SignPath
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'deskfolk' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: windows-installer
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/signpath-installer-out

      - name: Apply and verify signed Windows installer
        if: steps.signpath.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = Join-Path $env:RUNNER_TEMP 'signpath-installer-out'
          $unpacked = Join-Path $env:RUNNER_TEMP 'signpath-installer-unpacked'
          if (Test-Path $unpacked) { Remove-Item -Recurse -Force $unpacked }
          New-Item -ItemType Directory -Force -Path $unpacked | Out-Null

          $zips = Get-ChildItem -Path $outDir -Filter '*.zip' -File
          if ($zips.Count -gt 0) {
            Expand-Archive -Path $zips[0].FullName -DestinationPath $unpacked -Force
          } else {
            Copy-Item -Path (Join-Path $outDir '*') -Destination $unpacked -Recurse -Force
          }

          $signed = Get-ChildItem -Path $unpacked -Filter '*-setup.exe' -File -Recurse | Select-Object -First 1
          if (-not $signed) { throw "Signed installer missing in $unpacked" }
          $dst = Join-Path (Join-Path $env:RUNNER_TEMP 'deskfolk') $signed.Name
          Copy-Item -Path $signed.FullName -Destination $dst -Force
          $sig = Get-AuthenticodeSignature -LiteralPath $dst
          if ($sig.Status -ne 'Valid') {
            throw "Invalid Authenticode signature on $($signed.Name): $($sig.Status) ($($sig.StatusMessage))"
          }
          Write-Host "Verified signature on $($signed.Name): $($sig.SignerCertificate.Subject)"

      - name: Check the signed Windows installer
        if: steps.signpath.outputs.enabled == 'true'
        run: |
          setup=( "$RUNNER_TEMP"/deskfolk/*-setup.exe )
          if [ ! -f "${setup[0]}" ]; then
            echo "Signed installer missing" >&2
            exit 1
          fi
          upgrade=()
          for previous in "$RUNNER_TEMP"/previous/*/*_x64-setup.exe; do
            [ -f "$previous" ] && upgrade+=(--upgrade-from "$previous")
          done
          bun apps/desktop-nsh/scripts/package.ts --release --smoke-only "${setup[0]}" "${upgrade[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: deskfolk-windows-x64
          path: ${{ runner.temp }}/deskfolk/*-setup.exe
          if-no-files-found: error

  # The Linux packages, built and checked on Linux (x86_64): the deb is installed over 0.4.0's, the
  # Tauri preview, with that running, then the app is launched with its own daemon and removed; the
  # AppImage is launched and quit.
  package-linux:
    name: Package the Linux deb and AppImage
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop-nsh -> target
            apps/rtc-helper -> target

      - name: The pinned NSH commit
        id: nsh
        run: echo "rev=$(grep -m1 '^nsh-core' apps/desktop-nsh/Cargo.toml | sed -E 's/.*rev = "([0-9a-f]+)".*/\1/')" >> "$GITHUB_OUTPUT"

      # The key nsh-desktop.yml saves under on main (its Linux leg), where a tag can read it.
      - name: Restore the nsh CLI of that commit
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DESKFOLK_NSH_CACHE }}
          key: nsh-cli-${{ runner.os }}-${{ steps.nsh.outputs.rev }}

      - name: Install system libraries
        run: bash scripts/linux-desktop-deps.sh libsecret-1-dev dpkg-dev desktop-file-utils xvfb dbus-x11 xauth

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # Pinned releases; they run extracted (no FUSE on a runner). The GTK plugin is a script.
      - name: AppImage tools
        run: |
          tools="$RUNNER_TEMP/appimage-tools"
          mkdir -p "$tools"
          curl -fsSL -o "$tools/linuxdeploy" https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2/linuxdeploy-x86_64.AppImage
          curl -fsSL -o "$tools/appimagetool" https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          curl -fsSL -o "$tools/linuxdeploy-plugin-gtk.sh" https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x "$tools"/*
          {
            echo "LINUXDEPLOY=$tools/linuxdeploy"
            echo "APPIMAGETOOL=$tools/appimagetool"
            echo "LINUXDEPLOY_PLUGIN_GTK=$tools/linuxdeploy-plugin-gtk.sh"
            echo "APPIMAGE_EXTRACT_AND_RUN=1"
          } >> "$GITHUB_ENV"

      # 0.4.0's deb, the last Tauri preview: the smoke installs and starts it, then goes over it.
      - name: Earlier deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/previous"
          gh release download v0.4.0 --repo "$GITHUB_REPOSITORY" --pattern '*_amd64.deb' --dir "$RUNNER_TEMP/previous" || true
          ls -la "$RUNNER_TEMP/previous"

      - name: Package and check the deb and the AppImage
        run: |
          upgrade=()
          for previous in "$RUNNER_TEMP"/previous/*_amd64.deb; do
            [ -f "$previous" ] && upgrade+=(--upgrade-from "$previous")
          done
          dbus-run-session -- xvfb-run -a bun apps/desktop-nsh/scripts/package.ts --release --smoke "${upgrade[@]}" --out "$RUNNER_TEMP/deskfolk"

      - uses: actions/upload-artifact@v4
        with:
          name: deskfolk-linux-x64
          path: |
            ${{ runner.temp }}/deskfolk/*_amd64.deb
            ${{ runner.temp }}/deskfolk/*_amd64.AppImage
          if-no-files-found: error

  # One step, once the images and the installers exist: no half release for anyone's update check.
  publish:
    name: Publish the release
    needs: [package, package-windows, package-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/download-artifact@v4
        with:
          pattern: deskfolk-*
          merge-multiple: true
          path: dist

      # The body is this version's CHANGELOG section: the app renders it in the About card when it
      # finds an update, so it has to say what changed rather than point at the file.
      # MACOS_NOTARIZED and WINDOWS_SIGNED pick the signing note under it.
      - name: Release notes from CHANGELOG
        env:
          MACOS_NOTARIZED: ${{ secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
          WINDOWS_SIGNED: ${{ needs.package-windows.outputs.signed == 'true' }}
        run: bun apps/desktop-nsh/scripts/release-notes.ts > "$RUNNER_TEMP/notes.md"

      - name: Create the release with the images and the installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*-setup.exe dist/*_amd64.deb dist/*_amd64.AppImage --verify-tag --title "Deskfolk $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
