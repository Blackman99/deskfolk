<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Deskfolk promo</title>
<!--
  The motion promo linked from the README (see docs/development.md). The brand mark's circles are the cast:
  white discs are the Bots, the amber disc is Deskfolk, which never talks and only checks. Amber is kept for
  the app's own actions, mint for what is verified. Every frame is a pure function of time: seek(t) lays the
  whole stage out for t, CUES lists the sound events, render.mjs captures the frames and audio.py scores them.
  ?lang=zh|en picks the copy. Fonts are the system's SF Pro Rounded and SF Mono, served by render.mjs.
-->
<style>
@font-face{font-family:"Folk Rounded";src:url(fonts/SFNSRounded.ttf) format("truetype");font-weight:100 1000;}
@font-face{font-family:"Folk Mono";src:url(fonts/SFNSMono.ttf) format("truetype");font-weight:300 900;}
:root{
  --field:#0f6776; --deep:#0a4a55; --deeper:#07353d;
  --paper:#ffffff; --ink:#0b2e35; --ink2:#557277;
  --amber:#f0ab3d; --amber-ink:#402803;
  --mint:#a3ecd5; --mint-ink:#063d31;
  --mist:rgba(255,255,255,.66); --line:rgba(255,255,255,.34);
}
*{box-sizing:border-box}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--field);color:#fff;

.scene{position:absolute;inset:0;display:none}
.a{position:absolute;left:0;top:0;will-change:transform,opacity}
.layer{position:absolute;left:0;top:0;overflow:visible}

#black{position:absolute;inset:0;background:#000;z-index:60;opacity:0}

.disc{border-radius:50%}
.white{background:#fff}
.amberbg{background:var(--amber)}
.ringed{box-shadow:0 0 0 7px var(--field)}
.pulse{border-radius:50%;border:4px solid #fff}
.pulse.mintp{border-color:var(--mint)}
.pulse.amberp{border-color:var(--amber);border-width:5px}
.ring{border-radius:50%;border:5px solid var(--amber)}
.ring.mintring{border-color:var(--mint)}

.super{position:absolute;left:160px;bottom:112px;z-index:30}
.super .line{overflow:hidden;padding:6px 0 10px}
.super .line span{display:block;white-space:nowrap}
.super .main span,.super .line.big span{font-size:68px;font-weight:600;letter-spacing:.5px;line-height:1.18}
.super .sub span{font-size:38px;font-weight:500;color:var(--mist);line-height:1.2}
.super .line.big span{font-weight:600;color:#fff;letter-spacing:.5px;line-height:1.18}
.en .super .line.big span{font-size:62px;letter-spacing:0}
.s0 .bubble{font-size:40px;padding:24px 34px;border-radius:34px}
.en .super .main span{font-size:62px;letter-spacing:0}

.bubble{background:#fff;color:var(--ink);font-size:34px;font-weight:500;line-height:1;padding:21px 30px;

  s5a: "Everyone went quiet. The job isn't done.", s5b: 'Stalled halfway? The app follows up.', s5c: 'Still nothing? It lets you know.',

const LANG = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'zh';
document.documentElement.lang = LANG;
const T = STR[LANG];
const stage = document.getElementById('stage');
stage.classList.add(LANG);
const URL_TEXT = 'github.com/Blackman99/deskfolk';
const DURATION = 86;

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  lin: p => p,
  out: p => 1 - (1 - p) ** 3,
  out5: p => 1 - (1 - p) ** 5,
  in: p => p ** 3,
  in2: p => p * p,
  io: p => (p < 0.5 ? 4 * p ** 3 : 1 - (-2 * p + 2) ** 3 / 2),
  back: p => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * (p - 1) ** 3 + c1 * (p - 1) ** 2; },
  spring: p => (p >= 1 ? 1 : 1 - Math.exp(-6.5 * p) * Math.cos(12 * p)),
};
const P = (t, t0, t1, e = E.out) => e(clamp((t - t0) / (t1 - t0)));
function kf(t, fr) {
  if (t <= fr[0][0]) return fr[0][1];
  for (let i = 0; i < fr.length - 1; i++) {
    const [t0, v0] = fr[i], [t1, v1, e] = fr[i + 1];
    if (t < t1) return lerp(v0, v1, (e || E.io)((t - t0) / (t1 - t0)));
  }
  return fr[fr.length - 1][1];
}

// ---------- dom ----------
function el(parent, cls = '', html = '', tag = 'div') {
  const e = document.createElement(tag);
  e.className = 'a ' + cls;
  if (html) e.innerHTML = html;
  parent.appendChild(e);
  return e;
}
function size(e, d) { e.style.width = e.style.height = d + 'px'; }
function put(e, x, y, s = 1, o = 1, r = 0, ax = '-50%', ay = '-50%') {
  if (o <= 0.001 || s <= 0.001) { e.style.visibility = 'hidden'; e.style.opacity = 0; return; }
  e.style.visibility = 'visible';
  e.style.opacity = o;
  e.style.transform = `translate(${x.toFixed(2)}px,${y.toFixed(2)}px) translate(${ax},${ay}) scale(${s.toFixed(4)}) rotate(${r.toFixed(2)}deg)`;
}
const NS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function layer(root) { return sv('svg', { width: 1920, height: 1080, viewBox: '0 0 1920 1080', class: 'layer' }, root); }
function stroke(svg, d, color = 'rgba(255,255,255,.34)', w = 3, extra = {}) {
  return sv('path', { d, fill: 'none', stroke: color, 'stroke-width': w, 'stroke-linecap': 'round', pathLength: 1, 'stroke-dasharray': '1 1', 'stroke-dashoffset': 1, ...extra }, svg);
}
function draw(path, p, o = 1) { path.setAttribute('stroke-dashoffset', (1 - p).toFixed(4)); path.style.opacity = p > 0 ? o : 0; }

function Super(root, lines) {
  const w = document.createElement('div');
  w.className = 'super';
  root.appendChild(w);
  const spans = lines.map((txt, i) => {
    const d = document.createElement('div');
    d.className = 'line ' + (i ? 'sub' : 'main');
    const s = document.createElement('span');
    s.innerHTML = txt;
    d.appendChild(s);
    w.appendChild(d);
    return s;
  });
  return { w, spans };
}
function showSuper(sp, t, ins, out) {
  const q = out != null ? P(t, out, out + 0.35, E.in2) : 0;
  sp.w.style.display = t < ins[0] - 0.01 || (out != null && t > out + 0.4) ? 'none' : 'block';
  sp.spans.forEach((s, i) => {
    const p = P(t, ins[i], ins[i] + 0.55, E.out5);
    s.style.transform = `translateY(${((1 - p) * 110).toFixed(2)}%)`;
    s.style.opacity = (1 - q).toFixed(3);
  });
}
function stamp(t, t0) {
  if (t < t0) return { s: 0, o: 0, r: 0 };
  const p = P(t, t0, t0 + 0.26, E.out);
  return { s: lerp(1.8, 1, p), o: clamp((t - t0) / 0.06), r: lerp(-12, -3, p) };
}
function setStamp(e, st, fade = 1) {
  if (st.o * fade <= 0.001) { e.style.visibility = 'hidden'; return; }
  e.style.visibility = 'visible';
  e.style.opacity = st.o * fade;

  // amber rolls in and lands on card 3
  const rx = kf(t, [[46.0, 2060], [46.5, CX[2], E.out]]);

  const sw = P(t, 47.5, 47.8, E.out);

  c.sts[1].style.opacity = sw.toFixed(3);

  showSuper(c.sa, t, [43.2], 45.9);
  showSuper(c.sb, t, [46.2, 47.4], 50.0);
});
[0, 1, 2, 3].forEach(i => cue(42.6 + i * 0.14, 'card', { p: i, x: CX[i] }));

for (let k = 0; k < 5; k++) cue(43.9 + k * 0.5, 'tick', { x: 1500, soft: 1 });

// S6 acceptance checks ------------------------------------------------------
const ROWY = [150, 242, 334, 426];
scene(50.4, 60.6, root => {
  const panel = el(root, 'panel');
  const ph = el(panel, 'ph', T.checksTitle); ph.classList.remove('a');
  const pc = el(panel, 'pc', ''); pc.classList.remove('a');
  const rows = T.checks.map(([kind, target, res], i) => {
    const r = document.createElement('div'); r.className = 'row'; r.style.top = ROWY[i] - 46 + 'px'; panel.appendChild(r);
    r.innerHTML = `<div class="ic">${ICON_SPIN}${ICON_OK}${i === 3 ? ICON_BAD : ''}</div><div class="kind">${kind}</div><div class="target mono">${target}</div><div class="res mono">${res}</div>${i === 3 ? `<div class="detail"></div>` : ''}`;
    if (i < 3) { const s = document.createElement('div'); s.className = 'sep'; s.style.top = ROWY[i] + 46 + 'px'; panel.appendChild(s); }
    return { r, spin: r.querySelector('.spin'), ok: r.querySelector('.ok'), bad: r.querySelector('.bad'), res: r.querySelector('.res'), detail: r.querySelector('.detail') };
  });
  const svg = layer(root);
  const orbit = sv('circle', { cx: 0, cy: 0, r: 150, fill: 'none', stroke: '#f0ab3d', 'stroke-width': 4, 'stroke-dasharray': '6 16', 'stroke-linecap': 'round' }, svg);
  const amber = el(root, 'disc amberbg ringed'); size(amber, 96);
  const apulse = el(root, 'pulse amberp'); size(apulse, 96);
  const call = el(root, 'nudge', T.callback);
  const theo = el(root, 'disc white'); size(theo, 124);
  const tpl = el(root, 'pulse'); size(tpl, 124);
  const tname = el(root, 'name', 'Theo');
  const sup = Super(root, [T.s6a, T.s6b]);
  return { panel, pc, rows, orbit, amber, apulse, call, theo, tpl, tname, sup };
}, (t, c, root) => {
  root.style.opacity = P(t, 50.4, 50.6, E.lin) * (1 - P(t, 60.1, 60.5, E.lin));
  const pp = P(t, 50.5, 51.0, E.out);
  put(c.panel, 680, 440, lerp(0.96, 1, pp), pp);
  const RES = [51.5, 52.0, 52.5, 53.5];
  let passed = 0;
  c.rows.forEach((r, i) => {
    r.r.style.opacity = P(t, 50.7 + i * 0.12, 51.0 + i * 0.12, E.lin).toFixed(3);
    const rerun = i === 3 && t >= 55.9 && t < 56.5;
    const failed = i === 3 && t >= RES[3] && t < 55.9;
    const done = t >= RES[i] && !(i === 3 && t < 56.5);
    const spinning = t < RES[i] || rerun;
    r.spin.style.opacity = spinning ? 1 : 0;
    r.spin.style.transform = `rotate(${(t * 420) % 360}deg)`;
    const okT = i === 3 ? 56.5 : RES[i];
    const okp = P(t, okT, okT + 0.3, E.back);
    r.ok.style.opacity = done ? 1 : 0;
    r.ok.style.transform = `scale(${done ? okp : 0})`;
    if (r.bad) {
      const bp = P(t, RES[3], RES[3] + 0.3, E.back);
      r.bad.style.opacity = failed ? 1 : 0;
      r.bad.style.transform = `scale(${bp})`;
      r.detail.textContent = t < 56.5 ? T.seamFail : T.seamPass;
      r.detail.style.color = t < 56.5 ? '#f0ab3d' : '#a3ecd5';
      r.detail.style.opacity = (t < 56.5 ? P(t, RES[3] + 0.1, RES[3] + 0.4, E.lin) * (1 - P(t, 55.9, 56.1, E.lin)) : P(t, 56.55, 56.85, E.lin)).toFixed(3);
    }
    r.res.style.opacity = done ? 1 : 0;
    if (done) passed++;
  });
  c.pc.textContent = T.pass(passed, 4);
  c.pc.style.color = passed === 4 ? '#a3ecd5' : 'rgba(255,255,255,.66)';
  // the watcher runs them
  const running = (t > 50.9 && t < 53.6) || (t > 55.85 && t < 56.55);
  const aS = 2.3 * P(t, 50.6, 51.1, E.spring);
  const AX = 1560, AY = 400;
  put(c.amber, AX, AY, aS);
  c.orbit.setAttribute('cx', AX); c.orbit.setAttribute('cy', AY);
  c.orbit.setAttribute('transform', `rotate(${(t * 90) % 360} ${AX} ${AY})`);
  c.orbit.style.opacity = running ? 0.9 : 0;
  pulse(c.apulse, AX, AY, t, [51.5, 52.0, 52.5, 53.5, 56.5], 2.3, 0.5, 0.5, 0.8);
  const cp = P(t, 54.0, 54.35, E.spring);
  put(c.call, AX, 590, cp, 1 - P(t, 56.3, 56.6, E.lin));
  const th = P(t, 54.3, 54.7, E.spring);
  put(c.theo, AX - 40, 740, th * 0.7 * breath(t), 1 - P(t, 57.2, 57.6, E.lin));
  put(c.tname, AX + 66, 740, 1, P(t, 54.5, 54.8, E.lin) * (1 - P(t, 57.2, 57.6, E.lin)), 0, '0%', '-50%');
  pulse(c.tpl, AX - 40, 740, t, [54.8, 55.3], 0.7);
  showSuper(c.sup, t, [50.7, 57.0], 60.0);
});
[51.5, 52.0, 52.5].forEach((tt, i) => cue(tt, 'ok', { p: i, x: 400 }));
cue(53.5, 'warn', { x: 400 });
cue(54.0, 'nudge', { x: 1560 });

cue(56.5, 'chord', { x: 400 });

// S7 flow graph -------------------------------------------------------------
const LANE = { you: 206, I: 322, T: 438, K: 554 };
const G = [
  ['n1', 285, LANE.you, 'you'], ['n2', 505, LANE.I, 'I'], ['n3', 735, LANE.T, 'T'], ['a1', 915, LANE.T, 'app'],
  ['n4', 1080, LANE.T, 'T'], ['n5', 1275, LANE.K, 'K'], ['a2', 1440, LANE.K, 'app'], ['n6', 1640, LANE.K, 'K'],
  ['a3', 1640, 380, 'app'], ['n7', 1640, LANE.you, 'fin'],
];
const GE = [['n1', 'n2'], ['n2', 'n3'], ['n3', 'a1'], ['a1', 'n4'], ['n4', 'n5'], ['n5', 'a2'], ['a2', 'n6'], ['n6', 'a3'], ['a3', 'n7']];
scene(60.4, 66.6, root => {
  const cam = el(root, ''); cam.style.width = '1920px'; cam.style.height = '1080px'; cam.style.transformOrigin = '50% 40%';
  const svg = layer(cam);
  const nodes = {};
  for (const [id, x, y, who] of G) {
    let inner;
    if (who === 'app') inner = T.graph[id];
    else if (who === 'you') inner = `<div class="mini you">${T.you}</div>${T.graph[id]}`;
    else if (who === 'fin') inner = `<div class="mini">✓</div>${T.graph[id]}`;
    else inner = `<div class="mini">${who}</div>${T.graph[id]}`;
    nodes[id] = { e: el(cam, 'node' + (who === 'app' ? ' app' : who === 'fin' ? ' fin' : ''), inner), x, y };
  }
  const edges = GE.map(([a, b]) => ({ a, b, path: stroke(svg, 'M0 0', nodes[a].e.classList.contains('app') ? 'rgba(240,171,61,.95)' : 'rgba(255,255,255,.5)', 3.2) }));
  const conn = stroke(svg, 'M0 0', 'rgba(255,255,255,.6)', 3);
  const card = el(cam, 'detailcard', `<div class="hd"><div class="av" style="position:static">K</div>${T.detail.head}</div><div class="kv">${T.detail.rows.map(([k, v]) => `<div class="k">${k}</div><div class="v">${v}</div>`).join('')}</div>`);
  const sup = Super(root, [T.s7]);
  return { cam, nodes, edges, conn, card, sup, layoutDone: false };
}, (t, c, root) => {
  if (!c.layoutDone) {
    for (const k in c.nodes) c.nodes[k].w = c.nodes[k].e.offsetWidth, c.nodes[k].h = c.nodes[k].e.offsetHeight;
    // same-lane neighbours are chained by their measured widths, then the whole graph is fitted into the frame
    const N = c.nodes, GAP = 44;
    const after = (a, b, gap = GAP) => { N[b].x = N[a].x + N[a].w / 2 + gap + N[b].w / 2; };
    after('n3', 'a1'); after('a1', 'n4');
    N.n5.x = Math.max(N.n5.x, N.n4.x + N.n4.w / 2 + 50 + N.n5.w / 2);
    after('n5', 'a2'); after('a2', 'n6');
    N.a3.x = N.n7.x = N.n6.x;
    let lo = Infinity, hi = -Infinity;
    for (const k in N) { lo = Math.min(lo, N[k].x - N[k].w / 2); hi = Math.max(hi, N[k].x + N[k].w / 2); }
    const fit = Math.min(1, 1600 / (hi - lo)), shift = 160 + (1600 - (hi - lo) * fit) / 2 - lo * fit;
    c.fit = { s: fit, x: shift };
    for (const ed of c.edges) {
      const A = c.nodes[ed.a], B = c.nodes[ed.b];
      let d;
      if (Math.abs(A.x - B.x) < 40) { // vertical
        const y0 = A.y - A.h / 2, y1 = B.y + B.h / 2;
        d = `M ${A.x} ${y0} L ${B.x} ${y1}`;
      } else {
        const x0 = A.x + A.w / 2, x1 = B.x - B.w / 2, mx = (x0 + x1) / 2;
        d = `M ${x0} ${A.y} C ${mx} ${A.y} ${mx} ${B.y} ${x1} ${B.y}`;
      }
      ed.path.setAttribute('d', d);
    }
    const n6 = c.nodes.n6;
    c.conn.setAttribute('d', `M ${n6.x - 60} ${n6.y + n6.h / 2} L ${n6.x - 60} 612`);
    c.layoutDone = true;
  }
  root.style.opacity = P(t, 60.4, 60.6, E.lin) * (1 - P(t, 66.1, 66.5, E.lin));
  const zoom = lerp(1.0, 1.035, P(t, 60.5, 66.5, E.lin));
  c.cam.style.transform = `translate(960px,420px) scale(${zoom.toFixed(4)}) translate(-960px,-420px) translate(${c.fit.x.toFixed(2)}px,0) scale(${c.fit.s.toFixed(4)})`;
  c.cam.style.transformOrigin = '0 0';
  const T0 = 60.75, DT = 0.34;
  const popAt = { n1: 60.55 };
  c.edges.forEach((ed, i) => { const s = T0 + i * DT; draw(ed.path, P(t, s, s + DT, E.io)); popAt[ed.b] = s + DT * 0.85; });
  for (const k in c.nodes) {
    const n = c.nodes[k];
    const p = P(t, popAt[k], popAt[k] + 0.35, E.spring);
    const hi = k === 'n6' ? 1 + 0.08 * Math.sin(Math.PI * clamp((t - 63.95) / 0.35)) : 1;
    put(n.e, n.x, n.y, p * hi, p > 0 ? 1 : 0);
  }
  draw(c.conn, P(t, 64.05, 64.35, E.io));
  const cp = P(t, 64.25, 64.7, E.spring);
  put(c.card, Math.min(c.nodes.n6.x - 200, (1760 - c.fit.x) / c.fit.s - 310), 612, cp, cp > 0 ? 1 : 0, 0, '-50%', '0%');
  showSuper(c.sup, t, [60.7], 66.0);
});
GE.forEach((_, i) => cue(60.75 + i * 0.34 + 0.29, 'node', { p: i, x: G[i + 1][1] }));
cue(60.55, 'node', { p: -1, x: 285 });
cue(64.25, 'pop', { p: 3, x: 1330 });

// S8 local ------------------------------------------------------------------
scene(66.4, 74.6, root => {
  const svg = layer(root);
  const screen = stroke(svg, 'M 388 170 H 1132 A 28 28 0 0 1 1160 198 V 642 A 28 28 0 0 1 1132 670 H 388 A 28 28 0 0 1 360 642 V 198 A 28 28 0 0 1 388 170 Z', '#fff', 5);
  const base = stroke(svg, 'M 300 684 H 1220 Q 1220 706 1196 710 H 324 Q 300 706 300 684 Z', '#fff', 5);
  const wire = stroke(svg, 'M 1172 420 H 1406', 'rgba(255,255,255,.55)', 3);
  const dots = [0, 1, 2, 3].map(i => el(root, 'disc ' + (i === 3 ? 'amberbg' : 'white')));
  dots.forEach(d => size(d, 34));
  const icons = [el(root, '', ICON_FOLDER), el(root, '', ICON_KEY)];
  const labels = T.items.map(x => el(root, 'itemlabel', x));
  const endpoint = el(root, 'endpoint', `<div>${T.endpoint[0]}</div><div>${T.endpoint[1]}</div>`);
  const packets = [0, 1, 2, 3].map(() => { const p = el(root, 'disc white'); size(p, 14); return p; });
  const dialog = el(root, 'dialog', `<div class="hd"><div class="av" style="position:static">K</div>${T.ask}</div><div class="host">${T.host}</div><div class="btns"><div class="btn deny">${T.deny}</div><div class="btn allow">${T.allow}</div></div>`);
  const cursor = el(root, '', ICON_CURSOR);
  const sup = Super(root, [T.s8a, T.s8b]);
  return { screen, base, wire, dots, icons, labels, endpoint, packets, dialog, allow: dialog.querySelector('.allow'), cursor, sup, lay: null };
}, (t, c, root) => {
  if (!c.lay) {
    // allow-button centre, relative to the dialog centre (dialog is laid out at scale 1)
    const d = c.dialog, a = c.allow;
    c.lay = { ax: a.offsetLeft + a.offsetWidth / 2 - d.offsetWidth / 2, ay: a.offsetTop + a.offsetHeight / 2 - d.offsetHeight / 2 };
  }
  root.style.opacity = P(t, 66.4, 66.6, E.lin) * (1 - P(t, 74.1, 74.5, E.lin));
  draw(c.screen, P(t, 66.6, 67.5, E.io));
  draw(c.base, P(t, 67.1, 67.6, E.io));
  const IX = [560, 760, 960], IY = 392;
  const cast = [[-27, -20], [9, -20], [-27, 16], [9, 16]];
  c.dots.forEach((d, i) => put(d, IX[0] + cast[i][0] + 9, IY + cast[i][1] + 2, P(t, 67.6 + i * 0.06, 68.0 + i * 0.06, E.spring)));
  c.icons.forEach((e, i) => put(e, IX[i + 1], IY, P(t, 67.8 + i * 0.12, 68.2 + i * 0.12, E.spring)));
  c.labels.forEach((e, i) => put(e, IX[i], IY + 96, 1, P(t, 68.0 + i * 0.1, 68.4 + i * 0.1, E.lin)));
  draw(c.wire, P(t, 68.4, 68.9, E.io));
  put(c.endpoint, 1560, 420, P(t, 68.7, 69.1, E.spring));
  c.packets.forEach((p, i) => {
    const t0 = 69.0 + i * 0.35, u = clamp((t - t0) / 0.7);
    const back = i % 2 === 1;
    const x = back ? lerp(1400, 1180, E.io(u)) : lerp(1180, 1400, E.io(u));
    put(p, x, 420, 1, t >= t0 && u < 1 ? Math.sin(Math.PI * u) : 0);
    p.style.background = back ? '#a3ecd5' : '#fff';
  });
  // approval
  const dp = P(t, 70.5, 70.9, E.spring);
  const dq = P(t, 72.35, 72.65, E.in2);
  put(c.dialog, 760, 420, dp * (1 - 0.08 * dq), dp > 0 ? 1 - dq : 0);
  const press = t >= 72.0 && t < 72.25;
  c.allow.style.background = press ? '#0a4a55' : '#0f6776';
  c.allow.style.transform = press ? 'scale(.95)' : '';
  const cx = kf(t, [[70.9, 1320], [71.8, 760 + c.lay.ax, E.io]]);
  const cy = kf(t, [[70.9, 900], [71.8, 420 + c.lay.ay, E.io]]);
  const co = P(t, 70.8, 71.0, E.lin) * (1 - P(t, 72.6, 72.9, E.lin));
  put(c.cursor, cx - 5, cy - 4, press ? 0.9 : 1, co, 0, '0%', '0%');
  showSuper(c.sup, t, [66.8, 70.6], 74.0);
});
cue(66.6, 'draw', { d: 1.0 });
cue(67.6, 'pop', { p: 0, x: 560 }); cue(67.8, 'pop', { p: 1, x: 760 }); cue(67.92, 'pop', { p: 2, x: 960 });
cue(68.7, 'pop', { p: 3, x: 1560 });
[0, 1, 2, 3].forEach(i => cue(69.0 + i * 0.35, 'packet', { x: 1290, p: i }));
cue(70.5, 'dialog', { x: 760 });
cue(72.0, 'click', { x: 900 });
cue(72.35, 'ok', { x: 760, p: 1 });

// S9 other features --------------------------------------------------------
scene(74.4, 78.6, root => {
  const box = document.createElement('div'); box.className = 'pillbox'; root.appendChild(box);
  const pills = T.also.map(x => { const p = document.createElement('div'); p.className = 'pill'; p.textContent = x; box.appendChild(p); return p; });

});
T.also.forEach((_, i) => cue(74.5 + i * 0.5, 'pill', { p: i, x: 960 }));

scene(78.1, 86.01, root => {

  const fall = P(t, 78.0, 78.5, E.in2);
  const squash = t > 78.5 ? 1 - 0.06 * Math.sin(Math.PI * clamp((t - 78.5) / 0.25)) : 1;

  put(c.tagl, 960, 680, 1, 1); c.tagl.firstChild.style.transform = `translateY(${(1 - w2) * 110}%)`;
  put(c.endl, 960, 858, 1, P(t, 80.4, 80.9, E.lin));
  put(c.url, 960, 912, 1, P(t, 80.7, 81.2, E.lin));
  document.getElementById('black').style.opacity = P(t, 85.0, 86.0, E.lin);
});
cue(78.5, 'impact', { big: 1 });
cue(79.1, 'swell', { d: 1.4 });

// ---------- runtime ----------
function seek(t) {
  for (const s of scenes) {
    const on = t >= s.t0 && t < s.t1;
    s.root.style.display = on ? 'block' : 'none';
    if (on) s.update(t, s.ctx, s.root);
  }
  if (t < 85) document.getElementById('black').style.opacity = 0;
}
window.ready = (async () => {
  await Promise.all([
    document.fonts.load('600 40px "Folk Rounded"'), document.fonts.load('700 40px "Folk Rounded"'),
    document.fonts.load('400 30px "Folk Mono"'),
  ]);
  for (const s of scenes) { s.root.style.display = 'block'; s.ctx = s.build(s.root); }
  // first update of each scene measures its layout while visible
  for (const s of scenes) s.update(s.t0 + 0.001, s.ctx, s.root);
  for (const s of scenes) s.root.style.display = 'none';
  seek(0);
  return true;
})();
window.seek = seek;
window.DURATION = DURATION;
window.CUES = CUES;
window.LANG = LANG;
