<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon-48.png" type="image/png" sizes="48x48" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef2f7" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1219" />
		<meta name="application-name" content="Real Bot" />
		<meta name="apple-mobile-web-app-title" content="Real Bot" />
		<script>
			(function () {
				try {
					var raw = localStorage.getItem('real-bot-theme');
					if (raw === 'light' || raw === 'dark') {
						document.documentElement.setAttribute('data-theme', raw);
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
