<!doctype html>
<html lang="zh-CN">
	<head>

		<meta name="color-scheme" content="light dark" />
		<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='5' width='18' height='13' rx='4' fill='none' stroke='%23146a7c' stroke-width='2'/%3E%3Ccircle cx='9' cy='11.5' r='1.5' fill='%23146a7c'/%3E%3Ccircle cx='15' cy='11.5' r='1.5' fill='%23146a7c'/%3E%3Cpath d='M12 2v3' stroke='%23146a7c' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
		<script>
			(function () {
				try {
					var raw = localStorage.getItem('real-bot-theme');
					if (raw === 'light' || raw === 'dark') {
						document.documentElement.setAttribute('data-theme', raw);
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
