<!doctype html>
<html lang="zh-Hans">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			(function () {
				try {
					var raw = localStorage.getItem('real-bot-theme');
					var pref = raw === 'light' || raw === 'dark' ? raw : 'system';
					var isDark = pref === 'dark' || (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
					var resolved = isDark ? 'dark' : 'light';
					document.documentElement.setAttribute('data-theme', resolved);
					document.documentElement.setAttribute('data-theme-preference', pref);
					if (isDark) {
						document.documentElement.classList.add('dark');
					} else {
						document.documentElement.classList.remove('dark');
					}
					document.documentElement.style.colorScheme = resolved;
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
