<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    The phone's home-screen icon: the art of app-icon.svg full bleed, with no corners, margins or
    shadow, since the phone masks it. The art is shrunk to 84% about the centre (the tile and the
    desk are drawn wider so they still reach the edges), which keeps both teammates inside the
    central 80% a maskable icon may be cut to; only the bubble's corner reaches past it. Exported
    to the messenger's static icon-512, icon-192 and apple-touch-icon by scripts/app-icon/build.sh.
    No double hyphens in comments.
  -->
  <defs>
    <radialGradient id="tile" gradientUnits="userSpaceOnUse" cx="128" cy="40" r="250">
      <stop offset="0" stop-color="#33a4b7"/>
      <stop offset=".55" stop-color="#167689"/>
      <stop offset="1" stop-color="#0c4a57"/>
    </radialGradient>
    <linearGradient id="deskTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cbccb"/>
      <stop offset="1" stop-color="#2f93a5"/>
    </linearGradient>
    <linearGradient id="deskFront" gradientUnits="userSpaceOnUse" x1="0" y1="196" x2="0" y2="256">
      <stop offset="0" stop-color="#0f5f6e"/>
      <stop offset="1" stop-color="#093f4a"/>
    </linearGradient>
    <linearGradient id="ao" gradientUnits="userSpaceOnUse" x1="0" y1="150" x2="0" y2="184">
      <stop offset="0" stop-color="#062a31" stop-opacity="0"/>
      <stop offset="1" stop-color="#062a31" stop-opacity=".32"/>
    </linearGradient>
    <radialGradient id="mochi" cx=".38" cy=".3" r=".78">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#f1f5f6"/>
      <stop offset="1" stop-color="#c3d2d6"/>
    </radialGradient>
    <radialGradient id="pudding" cx=".38" cy=".3" r=".78">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset=".55" stop-color="#f0ab3d"/>
      <stop offset="1" stop-color="#c47a14"/>
    </radialGradient>
    <radialGradient id="handM" cx=".4" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cdd9dc"/>
    </radialGradient>
    <radialGradient id="handP" cx=".4" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffcf72"/>
      <stop offset="1" stop-color="#d48b1e"/>
    </radialGradient>
    <clipPath id="mochiClip"><circle cx="78" cy="140" r="58"/></clipPath>
    <clipPath id="both"><circle cx="78" cy="140" r="58"/><circle cx="170" cy="134" r="62"/></clipPath>
  </defs>
  <g transform="scale(4) translate(128 128) scale(.84) translate(-128 -128)">
    <rect x="-30" y="-30" width="316" height="316" fill="url(#tile)"/>
    <circle cx="78" cy="140" r="58" fill="url(#mochi)"/>
    <g clip-path="url(#mochiClip)"><circle cx="170" cy="134" r="69" fill="url(#tile)"/></g>
    <circle cx="170" cy="134" r="62" fill="url(#pudding)"/>
    <rect y="140" width="256" height="50" fill="url(#ao)" clip-path="url(#both)"/>
    <ellipse cx="63" cy="128" rx="6.2" ry="8.6" fill="#1d2a2f"/>
    <circle cx="65" cy="124.6" r="2.1" fill="#fff"/>
    <ellipse cx="89" cy="128" rx="6.2" ry="8.6" fill="#1d2a2f"/>
    <circle cx="91" cy="124.6" r="2.1" fill="#fff"/>
    <ellipse cx="54" cy="140" rx="7" ry="4" fill="#f0ab3d" opacity=".45"/>
    <ellipse cx="98" cy="140" rx="7" ry="4" fill="#f0ab3d" opacity=".45"/>
    <path d="M70.5 145q5.5 6.82 11 0" fill="none" stroke="#1d2a2f" stroke-width="4.6" stroke-linecap="round"/>
    <ellipse cx="157" cy="122" rx="6.2" ry="8.6" fill="#3d2804"/>
    <circle cx="159" cy="118.6" r="2.1" fill="#fff"/>
    <ellipse cx="183" cy="122" rx="6.2" ry="8.6" fill="#3d2804"/>
    <circle cx="185" cy="118.6" r="2.1" fill="#fff"/>
    <ellipse cx="148" cy="134" rx="7" ry="4" fill="#d9661c" opacity=".45"/>
    <ellipse cx="192" cy="134" rx="7" ry="4" fill="#d9661c" opacity=".45"/>
    <path d="M163.5 139q6.5 8.06 13 0" fill="none" stroke="#3d2804" stroke-width="4.6" stroke-linecap="round"/>
    <rect x="-30" y="180" width="316" height="16" fill="url(#deskTop)"/>
    <rect x="-30" y="180" width="316" height="2.4" fill="#fff" opacity=".5"/>
    <rect x="-30" y="196" width="316" height="90" fill="url(#deskFront)"/>
    <rect x="-30" y="196" width="316" height="2" fill="#062a31" opacity=".35"/>
    <ellipse cx="56" cy="185" rx="13" ry="9" fill="url(#handM)"/>
    <ellipse cx="102" cy="185" rx="13" ry="9" fill="url(#handM)"/>
    <ellipse cx="146" cy="185" rx="13.5" ry="9.5" fill="url(#handP)"/>
    <ellipse cx="196" cy="185" rx="13.5" ry="9.5" fill="url(#handP)"/>
    <g transform="translate(150 22)">
      <path d="M14 0h44a14 14 0 0 1 14 14v12a14 14 0 0 1-14 14H30l-12 11c-1.4 1.2-3.4 0-3-1.8l2-9.6A14 14 0 0 1 0 26V14A14 14 0 0 1 14 0Z" fill="#fff"/>
      <circle cx="22" cy="20" r="5" fill="#167689"/>
      <circle cx="36" cy="20" r="5" fill="#167689"/>
      <circle cx="50" cy="20" r="5" fill="#167689"/>
    </g>
  </g>
</svg>
