[[permission]]
identifier = "allow-local-api-endpoint"
description = "Lets the messenger read the in-memory local API origin and token."
commands.allow = ["local_api_endpoint"]

[[permission]]
identifier = "allow-open-workspace-path"
description = "Lets the messenger open a workspace file with the system."
commands.allow = ["open_workspace_path"]

[[permission]]
identifier = "allow-pick-workspace-folder"
description = "Lets the messenger open a native folder picker for the workspace path."
commands.allow = ["pick_workspace_folder"]

[[permission]]
identifier = "allow-set-launch-at-login"
description = "Lets the messenger enable or disable window autolaunch, independent of the runtime agent."
commands.allow = ["set_launch_at_login"]

[[permission]]
identifier = "allow-independent-runtime-status"
description = "Lets the messenger read independent-runtime status. Status-only; mutating ops use the local independent-runtime capability."
commands.allow = ["independent_runtime_status"]

[[permission]]
identifier = "allow-independent-runtime"
description = "Lets only the bundled main window enable, wait, force, disable, or cancel independent-runtime handoff. No renderer-supplied program, plist, or data-dir paths."
commands.allow = ["independent_runtime"]

[[permission]]
identifier = "allow-hide-main-window"
description = "Lets the messenger put the window away, which is what ⌘W does once no tab is left to close."
commands.allow = ["hide_main_window"]
