[package]
name = "real-bot-desktop"
version = "0.1.0-rc.15"
description = "Deskfolk window"
license = "MIT"
authors = ["Deskfolk contributors"]
edition = "2021"

[lib]
name = "real_bot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
semver = "1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
# Already resolved transitively (tauri/wry/tray-icon pull windows-sys 0.61 and
# windows-core 0.61 themselves), so pinning our own use of them costs nothing
# extra to build.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61"
# Windows Hello for confirming remote-access changes (`local_confirm::verify_owner`); the same
# 0.61 / 0.2 the dependencies above already resolve.
windows = { version = "0.61", features = ["Security_Credentials_UI", "Win32_Foundation", "Win32_System_WinRT"] }
windows-future = "0.2"
# For `Webview::with_webview`'s WebView2 controller handle (disabling the
# browser accelerator keys) — the same crate Tauri's own docs use for this.
webview2-com = "0.38"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSPasteboard", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSDictionary", "NSError", "NSBundle", "NSOperation"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "UNUserNotificationCenter",
    "UNNotificationRequest",
    "UNNotificationContent",
    "UNNotificationSound",
    "UNNotificationSettings",
    "UNNotificationResponse",
    "UNNotification",
    "UNNotificationTrigger",
    "block2",
] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
