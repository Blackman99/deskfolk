[workspace]
resolver = "3"
members = ["host", "native/terminal", "native/pdf", "app/native"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# NSH, pinned to the CLI that builds the bundles (`nsh --version`): the bundle format and the
# engine must match.
nsh-platform-macos = "=0.4.0"
nsh-engine = { version = "=0.4.0", default-features = false }
nsh-core = "=0.4.0"
# NSH's own objc2 line; Cargo unifies the features. In a debug build objc2 looks every message's
# method up and checks its encoding before sending it (`class_getInstanceMethod` on each send):
# the top of the main thread's samples during a live resize. The feature turns the check off (a
# release build has none anyway).
objc2 = { version = "0.6.5", features = ["disable-encoding-assertions"] }
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.release]
lto = "thin"
codegen-units = 4

# The dev build's dependencies optimised: NSH's layout, text and the QuickJS engine (its C through
# cc, at the package's opt-level) run several times slower unoptimised, and the window's layout
# fell behind live resizes and divider drags. The app's own crates stay unoptimised, so their
# rebuilds stay quick.
[profile.dev.package."*"]
opt-level = 3

# Except the app's native crate: it prepares every chat bubble's Markdown (`app/native/src/markdown`),
# on every render and every streamed token, and unoptimised that is a third of its speed.
[profile.dev.package.deskfolk-app-native]
opt-level = 3
