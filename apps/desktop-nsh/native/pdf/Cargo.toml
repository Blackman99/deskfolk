[package]
name = "deskfolk-native-pdf"
description = "NSH native component `deskfolk.pdf`: a PDF shown by PDFKit's PDFView (scroll, zoom, select, copy). No web view."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
log.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos.workspace = true
nsh-core.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSString", "NSURL", "NSGeometry", "NSData", "NSNotification"] }
objc2-app-kit = { workspace = true, features = ["NSView", "NSResponder", "NSColor"] }
objc2-pdf-kit = { version = "0.3.2", default-features = false, features = [
    "std", "objc2-app-kit", "PDFView", "PDFDocument", "PDFPage",
] }
