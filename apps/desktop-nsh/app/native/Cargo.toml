[package]
name = "deskfolk-app-native"
description = "The Deskfolk app's own Rust for every NSH target (macOS, Windows, Linux, web): the terminal (vt100 + canvas) and PDF pages (hayro)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nsh-core.workspace = true
nsh-base = { version = "=0.4.0", default-features = false }
vt100 = "0.16"
base64 = "0.22"
hayro = { version = "0.9", features = ["embed-fonts"] }
serde_json.workspace = true
serde.workspace = true
calamine = { version = "0.38", features = ["dates"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
chrono = { version = "0.4", default-features = false }
