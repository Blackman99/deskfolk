[package]
name = "real-bot-rtc"
version = "0.1.0"
description = "WebRTC data-channel bridge from a paired phone to macOS Screen Sharing, for Deskfolk's remote screen"
license = "MIT"
authors = ["Deskfolk contributors"]
edition = "2024"
publish = false

[[bin]]
name = "real-bot-rtc"
path = "src/main.rs"

[dependencies]
webrtc = { version = "=0.21.0", default-features = false, features = ["runtime-tokio", "crypto-ring"] }
# `MulticastDnsMode` is not re-exported by `webrtc`; same pinned version, nothing else enabled.
rtc = { version = "=0.21.0", default-features = false }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync"] }
async-trait = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# rtc-sctp 0.21.0 with a 200 ms floor on the retransmission timeout instead of one second:
# see vendor/rtc-sctp/README.md.
[patch.crates-io]
rtc-sctp = { path = "vendor/rtc-sctp" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
